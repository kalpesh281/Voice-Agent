[project]
name = "voice-booking-agent"
version = "2.0.0"
description = "Multi-category voice booking agent — Deepgram + LangGraph + MongoDB"
authors = [{name = "Kalpesh"}]
requires-python = ">=3.11"
dependencies = [
    # LLM & Agent
    "langchain>=0.3",
    "langchain-openrouter>=0.1",
    "langgraph>=0.4",
    "langgraph-checkpoint-mongodb>=0.3",
    "tiktoken>=0.7",
    # Voice
    "deepgram-sdk==7.3.1",
    "sounddevice>=0.5",
    "soundfile>=0.13",
    "numpy>=2.0",
    # Database
    "motor>=3.0",
    "pymongo[srv]>=4.0",
    # Config & Models
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # CLI
    "rich>=13.0",
    # Security
    "cryptography>=42.0",
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # Async
    "aiofiles>=24.0",
    "langchain-core>=1.4.0",
    # Auth
    "bcrypt>=4.0",
    "itsdangerous>=2.1",
    "livekit-agents[langchain]~=1.5",
    "livekit-plugins-deepgram>=1.5.17",
    "livekit-plugins-silero>=1.5.17",
    "livekit-plugins-turn-detector>=1.5.17",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mongomock-motor>=0.0.30",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
